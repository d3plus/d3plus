coverage:
  status:
    project:
      # Vitest's v8 coverage counts only executable lines (not comments,
      # blank lines or type declarations); the targets sit a few points under
      # each package's measured coverage.
      default:
        target: auto
        threshold: 1%
      angular:
        target: 95%
        flags: [angular]
      color:
        target: 90%
        flags: [color]
      core:
        target: 80%
        flags: [core]
      data:
        target: 90%
        flags: [data]
      dom:
        target: 90%
        flags: [dom]
      element:
        target: 75%
        flags: [element]
      export:
        target: 95%
        flags: [export]
      format:
        target: 70%
        flags: [format]
      locales:
        target: 95%
        flags: [locales]
      math:
        target: 80%
        flags: [math]
      react:
        target: 65%
        flags: [react]
      render:
        target: 80%
        flags: [render]
      ssr:
        target: 80%
        flags: [ssr]
      svelte:
        target: 95%
        flags: [svelte]
      text:
        target: 85%
        flags: [text]
      vue:
        target: 85%
        flags: [vue]
    patch:
      default:
        target: auto
        # Advisory only: changed-line coverage on a large refactor legitimately
        # dips below the project baseline. Report it, but don't fail the check.
        informational: true

flags:
  angular:
    paths:
      - packages/angular/
    carryforward: true
  color:
    paths:
      - packages/color/
    carryforward: true
  core:
    paths:
      - packages/core/
    carryforward: true
  data:
    paths:
      - packages/data/
    carryforward: true
  dom:
    paths:
      - packages/dom/
    carryforward: true
  element:
    paths:
      - packages/element/
    carryforward: true
  export:
    paths:
      - packages/export/
    carryforward: true
  format:
    paths:
      - packages/format/
    carryforward: true
  locales:
    paths:
      - packages/locales/
    carryforward: true
  math:
    paths:
      - packages/math/
    carryforward: true
  react:
    paths:
      - packages/react/
    carryforward: true
  render:
    paths:
      - packages/render/
    carryforward: true
  ssr:
    paths:
      - packages/ssr/
    carryforward: true
  svelte:
    paths:
      - packages/svelte/
    carryforward: true
  text:
    paths:
      - packages/text/
    carryforward: true
  vue:
    paths:
      - packages/vue/
    carryforward: true
