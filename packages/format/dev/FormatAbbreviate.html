<head>

  <meta charset="utf-8">
  <title>FormatAbbreviate</title>
  <meta name="description" content="formatAbbreviate() across magnitudes in the ar-SA locale.">
  <script src="/umd/d3plus-format.full.js"></script>

<body>
</body>

<script>

  // Prints each logged value into the page as well as the console.
  const output = document.body.appendChild(document.createElement("pre"));
  const log = (...args) => {
    console.log(...args);
    const text = args.map(a => {
      if (typeof a === "string") return a;
      try {
        return JSON.stringify(a, (k, v) => (typeof v === "function" ? `${v}` : v));
      } catch {
        return String(a);
      }
    });
    output.textContent += `${text.join(" ")}\n`;
  };

  log(d3plus.formatAbbreviate(12345));
  log(d3plus.formatAbbreviate(-12345));

  const numbers = [
    1234567890000000000,
    1234567890000000,
    1234567890000,
    1234567890,
    1000000009,
    1234567,
    123456,
    12345,
    1234,
    123,
    12,
    1,
    0.1,
    0.01,
    0.12,
    0.0123,
    0.00123,
    0.000123
  ];

  numbers.forEach(n => {
    const formatted = d3plus.formatAbbreviate(n, "ar-SA");
    log(n, formatted);
  });
