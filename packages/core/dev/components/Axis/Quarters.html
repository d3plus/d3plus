<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>Quarters · Axis</title>
  <meta name="description" content="Quarterly time axis in the ar-SA locale.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>
  <style>
    body {
      margin: 0;
    }
  </style>

</head>

<body>

</body>

<script>

  // "Q4 2019" → the first day of that quarter.
  const quarter = str => {
    const [, q, year] = str.match(/Q(\d) (\d{4})/);
    return new Date(+year, (q - 1) * 3, 1);
  };

  const dataset = [
    "Q4 2019",
    "Q1 2020",
    "Q2 2020",
    "Q3 2020",
    "Q4 2020",
    "Q1 2021",
    "Q2 2021",
    "Q3 2021",
    "Q4 2021",
    "Q1 2022",
    "Q2 2022",
    "Q3 2022",
    "Q4 2022",
    "Q1 2023",
    "Q2 2023",
    "Q3 2023",
    "Q4 2023",
    "Q1 2024",
    "Q2 2024",
    "Q3 2024",
    "Q4 2024",
    "Q1 2025",
    "Q2 2025",
    "Q3 2025",
    "Q4 2025",
    "Q1 2026",
    "Q2 2026",
    "Q3 2026",
    "Q4 2026",
    "Q1 2027",
    "Q2 2027",
    "Q3 2027",
    "Q4 2027",
    "Q1 2028",
    "Q2 2028",
  ].map(quarter);

  const bottom = new d3plus.AxisBottom()
    .domain([dataset[0], dataset[dataset.length - 1]])
    .data(dataset)
    .locale("ar-SA")
    .width(500)
    .height(200)
    .scale("time")
    .render();

</script>

</html>
