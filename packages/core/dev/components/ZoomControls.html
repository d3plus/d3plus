<!doctype html>
<html>

<head>

  <meta charset="utf-8">

  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding: 24px;
    }

    .demo {
      width: 320px;
    }

    .demo h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .demo iframe {
      width: 320px;
      height: 320px;
      border: 1px solid #ddd;
    }

  </style>

</head>

<body>

  <div class="demo">
    <h3>Default (structural style only, native chrome)</h3>
    <iframe id="viz-default"></iframe>
  </div>

  <div class="demo">
    <h3>Plain (all zoomControlStyle* false)</h3>
    <iframe id="viz-plain"></iframe>
  </div>

  <div class="demo">
    <h3>Bootstrap (.btn .btn-primary .btn-sm)</h3>
    <iframe id="viz-bootstrap"></iframe>
  </div>

  <div class="demo">
    <h3>Tailwind (utility classes)</h3>
    <iframe id="viz-tailwind"></iframe>
  </div>

  <div class="demo">
    <h3>Bulma (.button .is-info .is-small)</h3>
    <iframe id="viz-bulma"></iframe>
  </div>

  <div class="demo">
    <h3>Mantine (hand-matched approximation, not real Mantine CSS)</h3>
    <iframe id="viz-mantine"></iframe>
  </div>

</body>

<script>

  // Each panel renders inside its own iframe, with only the head tags it
  // needs. Frameworks like Bulma (and Tailwind's Preflight) reset bare
  // <button> elements via a global selector, not just classed ones — loaded
  // unscoped on one page, that reset silently leaks onto every OTHER
  // panel's buttons too (including "Default"/"Plain", which never asked for
  // it). An iframe per panel is what actually isolates the comparison.
  function mountPanel(iframeId, {head = "", zoomConfig = ""}) {
    const nodes = [
      {id: "alpha"},
      {id: "beta"},
      {id: "gamma"},
      {id: "epsilon"},
    ];
    const links = [
      {source: "alpha", target: "beta"},
      {source: "beta", target: "gamma"},
      {source: "gamma", target: "epsilon"},
      {source: "epsilon", target: "alpha"},
    ];

    const html = `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="../umd/d3plus-core.full.js"><\/script>
${head}
<style>
  body{margin:0}
  .icon-btn{width:40px}
  /* Mantine ships no static, importable Button class — its real styles
     compile into per-app-build hashed CSS Modules classes (.m_xxxxxxxx)
     that only exist after Mantine's own build step runs inside a React
     app; @mantine/core's published styles.css is just base theme/CSS-
     variable definitions, nothing consuming them into an actual button
     look. This hand-matches Mantine's default theme values (blue-6
     #228be6, sm radius, sm height/font) well enough to demonstrate the
     zoomControlClassName mechanism, but it is NOT Mantine's real output —
     a real app would pass whatever className/style its actual <Button>
     instance renders with. */
  .mantine-btn-approx {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    height: 30px;
    padding: 0 14px;
    background-color: #228be6;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .mantine-btn-approx:hover {
    background-color: #1c7ed6;
  }
</style>
</head>
<body>
<div id="viz" style="width:318px;height:318px;"></div>
<script>
  new d3plus.Network()
    .select("#viz")
    .nodes(${JSON.stringify(nodes)})
    .links(${JSON.stringify(links)})
    .zoom(true)
    // .duration(0)
    ${zoomConfig}
    .render();
<\/script>
</body>
</html>`;

    document.getElementById(iframeId).srcdoc = html;
  }

  mountPanel("viz-default", {});

  mountPanel("viz-plain", {
    zoomConfig: `
      .zoomControlStyle(false)
      .zoomControlStyleActive(false)
      .zoomControlStyleHover(false)
    `,
  });

  // Spacing between/around the buttons comes from the panel's own
  // container (a flex `gap` + edge padding — see `buildZoomControlPanel`
  // in zoomControls.ts), not from anything on the buttons themselves, so
  // it applies the same way whether or not `zoomControlClassName` is set —
  // no spacing utility class needed here. `icon-btn` (defined above, one
  // shared rule) pins every button to the same 40px width so the three
  // framework examples match each other — none ships an exact-pixel width
  // utility, so this is one small custom class layered on top of each
  // framework's own classes, same as a real project would do for an
  // icon-sized button. It's wider than d3plus's own bare 20px default on
  // purpose: each framework's own button padding (Bootstrap's `.btn-sm`,
  // Bulma's `.is-small` — a hefty 12px each side — Tailwind's `px-2`) needs
  // room alongside the icon, where a plain native button has none of that
  // padding to account for.
  mountPanel("viz-bootstrap", {
    head: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">',
    zoomConfig: `.zoomControlClassName("btn btn-primary btn-sm icon-btn")`,
  });

  mountPanel("viz-tailwind", {
    head: '<script src="https://cdn.tailwindcss.com"><\/script>',
    zoomConfig: `.zoomControlClassName("icon-btn rounded bg-indigo-600 px-2 py-1 text-xs font-semibold text-white shadow hover:bg-indigo-700")`,
  });

  mountPanel("viz-bulma", {
    head: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">',
    zoomConfig: `.zoomControlClassName("button is-info is-small icon-btn")`,
  });

  // No `head` — `.mantine-btn-approx` is defined in the shared <style>
  // above (a hand-matched approximation, not a real Mantine stylesheet;
  // see that rule's comment for why one can't be loaded from a CDN here).
  mountPanel("viz-mantine", {
    zoomConfig: `.zoomControlClassName("mantine-btn-approx icon-btn")`,
  });

</script>

</html>
