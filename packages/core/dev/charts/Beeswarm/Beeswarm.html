<!doctype html>
<html dir="ltr">

<head>

  <meta charset="utf-8">
  <title>Beeswarm</title>
  <meta name="description" content="Beeswarm variants: a default swarm, category lanes, sized circles in vertical lanes, 3000 points on canvas, a Plot toggling between scatter and swarm, and an implicit swarm with no y values.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; margin: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .viz { height: 360px; }
    h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    button { font: inherit; margin-left: 8px; }
  </style>

</head>

<body>
  <div class="grid">
    <div><h3>Default (swarm along x)</h3><div class="viz" id="basic"></div></div>
    <div><h3>Category lanes (y: "region")</h3><div class="viz" id="lanes"></div></div>
    <div><h3>Sized circles + vertical lanes</h3><div class="viz" id="sized"></div></div>
    <div><h3>Canvas, 3000 points (overflow: "shrink")</h3><div class="viz" id="dense"></div></div>
    <div><h3>Plot: scatter ↔ swarm <button id="toggle">Toggle swarm</button></h3><div class="viz" id="toggled"></div></div>
    <div><h3>Plot with no y values (implicit swarm)</h3><div class="viz" id="noY"></div></div>
  </div>
</body>

<script>

  // Seeded rows so the page renders identically every load.
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const normal = () => Math.sqrt(-2 * Math.log(random())) * Math.cos(2 * Math.PI * random());
  const regions = ["Africa", "Americas", "Asia", "Europe", "Oceania"];
  const countries = Array.from({length: 180}, (_, i) => {
    const income = Math.round(Math.exp(8.6 + 0.3 * (i % 5) + 0.8 * normal()));
    return {
      country: `Country ${i + 1}`,
      region: regions[i % 5],
      "GDP per Capita": income,
      "Life Expectancy": Math.round((48 + 3 * Math.log(income) + 2.5 * normal()) * 10) / 10,
      Population: Math.round(Math.exp(15.5 + 1.3 * normal())),
    };
  });
  const dense = Array.from({length: 3000}, (_, i) => ({id: i, group: ["Low", "Mid", "High"][i % 3], value: 10 * normal() + 8 * (i % 3)}));

  new d3plus.Beeswarm()
    .select("#basic")
    .data(countries)
    .groupBy("country")
    .x("Life Expectancy")
    .render();

  new d3plus.Beeswarm()
    .select("#lanes")
    .data(countries)
    .groupBy("country")
    .color("region")
    .x("Life Expectancy")
    .y("region")
    .render();

  new d3plus.Beeswarm()
    .select("#sized")
    .data(countries)
    .groupBy("country")
    .color("region")
    .size("Population")
    .x("region")
    .y("GDP per Capita")
    .render();

  new d3plus.Beeswarm()
    .select("#dense")
    .renderer("canvas")
    .data(dense)
    .groupBy("id")
    .color("group")
    .x("value")
    .y("group")
    .render();

  let swarm = false;
  const toggled = new d3plus.Plot()
    .select("#toggled")
    .data(countries)
    .groupBy("country")
    .color("region")
    .x("GDP per Capita")
    .y("Life Expectancy")
    .shapeConfig({Circle: {trail: false}})
    .duration(800)
    .render();
  document.getElementById("toggle").addEventListener("click", () => {
    swarm = !swarm;
    toggled.swarm(swarm).render();
  });

  new d3plus.Plot()
    .select("#noY")
    .data(countries.map(d => ({country: d.country, region: d.region, value: d["Life Expectancy"]})))
    .groupBy("country")
    .color("region")
    .x("value")
    .render();

</script>

</html>
