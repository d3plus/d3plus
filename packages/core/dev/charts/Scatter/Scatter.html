<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scatter</title>
    <meta
      name="description"
      content="Scatter variants: points on two continuous axes colored by group, sized points with a size legend, trend lines, and a dark theme."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 16px;
        padding: 16px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .viz {
        height: 400px;
      }
    </style>
  </head>

  <body>
    <div class="grid">
      <div>
        <h3>Default: a point per row, colored by species</h3>
        <div class="viz" id="basic"></div>
      </div>
      <div>
        <h3>Sized points (size: "mass")</h3>
        <div class="viz" id="sized"></div>
      </div>
      <div>
        <h3>Trend line per species</h3>
        <div class="viz" id="trend"></div>
      </div>
      <div>
        <h3>Dark theme</h3>
        <div class="viz" id="dark"></div>
      </div>
    </div>
  </body>

  <script>
    const penguins = [
      ["Adelie", 39.1, 18.7, 3750],
      ["Adelie", 37.8, 17.1, 3800],
      ["Adelie", 40.6, 18.6, 4000],
      ["Adelie", 36.7, 19.3, 3450],
      ["Adelie", 38.9, 17.8, 3625],
      ["Adelie", 41.1, 17.6, 3200],
      ["Chinstrap", 46.5, 17.9, 3500],
      ["Chinstrap", 50.0, 19.5, 3900],
      ["Chinstrap", 51.3, 19.2, 3650],
      ["Chinstrap", 45.4, 18.7, 3525],
      ["Chinstrap", 52.7, 19.8, 3725],
      ["Chinstrap", 49.6, 18.2, 3775],
      ["Gentoo", 46.1, 13.2, 4500],
      ["Gentoo", 50.0, 16.3, 5700],
      ["Gentoo", 48.7, 14.1, 4450],
      ["Gentoo", 47.6, 14.5, 5400],
      ["Gentoo", 46.5, 13.5, 4550],
      ["Gentoo", 49.9, 16.1, 5400],
    ].map(([species, bill, depth, mass], i) => ({
      id: species + " " + (i + 1),
      species,
      bill,
      depth,
      mass,
    }));

    const scatter = id =>
      new d3plus.Scatter()
        .select("#" + id)
        .data(penguins)
        .groupBy(["species", "id"])
        .x("bill")
        .y("depth");

    scatter("basic").render();
    scatter("sized").size("mass").render();
    scatter("trend").trendLine(true).render();
    scatter("dark").theme("dark").size("mass").render();
  </script>
</html>
