<!doctype html>
<html>

  <head>

    <meta charset="utf-8">
    <title>Stacked Grow</title>
    <meta name="description" content="Stacked bars growing in from their stack, one segment after another: vertical, horizontal, and diverging stacks, with a slow duration, a replay, and a data update that animates as before.">
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .controls {
        padding: 8px 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
        padding: 0 16px 16px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .viz {
        height: 360px;
      }
    </style>

  </head>

  <body>

    <div class="controls">
      <button id="replay">Replay</button>
      <button id="update">Update data</button>
    </div>
    <div class="grid">
      <section>
        <h3>Vertical</h3>
        <div class="viz" id="vertical"></div>
      </section>
      <section>
        <h3>Horizontal</h3>
        <div class="viz" id="horizontal"></div>
      </section>
      <section>
        <h3>Diverging</h3>
        <div class="viz" id="diverging"></div>
      </section>
    </div>

    <script>

      const regions = ["North", "South", "East", "West"];
      const channels = ["Online", "Retail", "Wholesale"];

      /** One value per channel and region; `seed` varies them for an update. */
      const sales = (seed, signed) => {
        const rows = [];
        channels.forEach((channel, c) => {
          regions.forEach((region, r) => {
            const value = 10 + ((r * 7 + c * 5 + seed * 3) % 11) * 3;
            rows.push({channel, region, value: signed && c === 1 ? -value / 2 : value});
          });
        });
        return rows;
      };

      let seed = 0;
      let charts = [];
      const build = () => {
        charts.forEach(viz => viz.destroy());
        document.querySelectorAll(".viz").forEach(el => (el.innerHTML = ""));
        charts = [
          new d3plus.BarChart()
            .select("#vertical")
            .data(sales(seed))
            .x("region")
            .y("value"),
          new d3plus.BarChart()
            .select("#horizontal")
            .data(sales(seed))
            .discrete("y")
            .x("value")
            .y("region"),
          new d3plus.BarChart()
            .select("#diverging")
            .data(sales(seed, true))
            .x("region")
            .y("value"),
        ];
        charts.forEach(viz => viz.groupBy("channel").stacked(true).duration(2400).render());
      };
      build();

      document.querySelector("#replay").addEventListener("click", build);
      document.querySelector("#update").addEventListener("click", () => {
        seed++;
        charts.forEach((viz, i) => viz.data(sales(seed, i === 2)).render());
      });

    </script>

  </body>

</html>
