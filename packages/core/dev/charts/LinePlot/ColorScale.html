<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ColorScale · LinePlot</title>
    <meta name="description" content="LinePlot whose lines are colored by a colorScale of each series' latest value.">
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body></body>

  <script>
    // Synthetic yearly exports (in USD) for a few large exporters.
    const countries = {
      China: [0.33, 0.24],
      "United States": [0.69, 0.07],
      Germany: [0.61, 0.08],
      Japan: [0.42, 0.03],
      France: [0.33, 0.04],
      Netherlands: [0.24, 0.08],
    };
    const data = [];
    Object.entries(countries).forEach(([country, [start, growth]]) => {
      for (let year = 2002; year <= 2020; year++) {
        const dip = year === 2009 ? 0.8 : 1;
        data.push({
          Country: country,
          Year: year,
          "Trade Value": start * 1e12 * Math.pow(1 + growth, year - 2002) * dip,
        });
      }
    });

    // Colors every line by the series' most recent value, not its first.
    const latest = {};
    data.forEach(d => {
      if (!latest[d.Country] || d.Year > latest[d.Country].Year) latest[d.Country] = d;
    });
    data.forEach(d => (d["Latest Trade Value"] = latest[d.Country]["Trade Value"]));

    new d3plus.LinePlot()
      .config({
        baseline: 0,
        axisPersist: true,
        colorScale: "Latest Trade Value",
        data,
        groupBy: "Country",
        x: "Year",
        y: "Trade Value",
        time: "Year",
      })
      .render();
  </script>
</html>
