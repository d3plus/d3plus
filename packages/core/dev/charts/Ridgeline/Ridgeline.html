<!doctype html>
<html dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Ridgeline</title>
    <meta
      name="description"
      content="Ridgeline variants: monthly temperature ridges, ridges sorted by median, low overlap with per-ridge widths, two series per row, and small multiples."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Inter, sans-serif;
        margin: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .viz {
        height: 420px;
      }
      .wide {
        grid-column: 1 / span 2;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
    </style>
  </head>

  <body>
    <div class="grid">
      <div>
        <h3>Default (overlap: 1.5)</h3>
        <div class="viz" id="basic"></div>
      </div>
      <div>
        <h3>medianSort: "descending"</h3>
        <div class="viz" id="sorted"></div>
      </div>
      <div>
        <h3>overlap: 0.9, densityScale: "width"</h3>
        <div class="viz" id="width"></div>
      </div>
      <div>
        <h3>Two series per row (groupBy: ["month", "city"])</h3>
        <div class="viz" id="series"></div>
      </div>
      <div class="wide">
        <h3>Small multiples (facet: "city")</h3>
        <div class="viz" id="facet"></div>
      </div>
    </div>
  </body>

  <script>
    // Seeded rows so the page renders identically every load.
    let seed = 23;
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const normal = () =>
      Math.sqrt(-2 * Math.log(random())) * Math.cos(2 * Math.PI * random());
    const round = v => Math.round(v * 10) / 10;

    const months = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December",
    ];
    const cities = [
      {city: "Lincoln", mean: 12, swing: 14, sd: 6},
      {city: "Seattle", mean: 12, swing: 6, sd: 3.5},
    ];
    const weather = cities.flatMap(({city, mean, swing, sd}) =>
      months.flatMap((month, m) =>
        Array.from({length: 30}, (_, day) => ({
          city,
          month,
          day: day + 1,
          "Mean Temperature (°C)": round(
            mean -
              swing * Math.cos((2 * Math.PI * (m + 0.5)) / 12) +
              sd * normal(),
          ),
        })),
      ),
    );
    const lincoln = weather.filter(d => d.city === "Lincoln");

    const genres = [
      "Ambient",
      "Blues",
      "Classical",
      "Country",
      "Electronic",
      "Folk",
      "Jazz",
      "Metal",
      "Pop",
      "Rock",
    ];
    const tracks = genres.flatMap((genre, g) =>
      Array.from({length: 80}, (_, i) => {
        // Some genres mix a short and a long format.
        const long = g % 3 === 0 && random() < 0.35;
        const minutes =
          3 + (g % 4) * 0.6 + (long ? 4 : 0) + (0.6 + (g % 3) * 0.3) * normal();
        return {
          genre,
          track: `${genre} ${i + 1}`,
          "Length (minutes)": round(Math.max(0.5, minutes)),
        };
      }),
    );

    new d3plus.Ridgeline()
      .select("#basic")
      .data(lincoln)
      .groupBy("month")
      .value("Mean Temperature (°C)")
      .render();

    new d3plus.Ridgeline()
      .select("#sorted")
      .data(tracks)
      .groupBy("genre")
      .value("Length (minutes)")
      .medianSort("descending")
      .render();

    new d3plus.Ridgeline()
      .select("#width")
      .data(tracks)
      .groupBy("genre")
      .value("Length (minutes)")
      .overlap(0.9)
      .densityScale("width")
      .render();

    new d3plus.Ridgeline()
      .select("#series")
      .data(weather)
      .groupBy(["month", "city"])
      .color("city")
      .value("Mean Temperature (°C)")
      .shapeConfig({Area: {fillOpacity: 0.6}})
      .render();

    new d3plus.Ridgeline()
      .select("#facet")
      .data(weather)
      .groupBy("month")
      .value("Mean Temperature (°C)")
      .facet("city")
      .legend(false)
      .render();
  </script>
</html>
