<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Figure</title>
    <meta
      name="description"
      content="Figure: different charts placed together under one title and download button — a treemap spanning two rows beside a bar chart and line plot whose plot areas line up, linked hover across charts, a breakpoint that stacks them on narrow screens, relative column widths, charts given as config, a nested figure, and a dark theme shared through chartConfig."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .controls {
        padding: 8px 16px;
        font-size: 13px;
      }
      .wrap {
        padding: 0 16px 16px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      .viz {
        height: 560px;
        border: 1px solid #eee;
      }
      .viz.short {
        height: 420px;
      }
      .dark {
        background: #1d1f23;
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <button id="highlight">Highlight Europe</button>
      <button id="clear">Clear highlight</button>
      <button id="columns">Toggle column widths</button>
      <button id="save">Save SVG</button>
    </div>
    <div class="wrap">
      <h3>Spans, aligned plot areas, and linked hover</h3>
      <div class="viz" id="figure"></div>
      <h3>Charts given as config, with relative column widths</h3>
      <div class="viz short" id="config"></div>
      <h3>A nested figure and a shared dark theme</h3>
      <div class="viz short dark" id="nested"></div>
    </div>

    <script>
      const regions = {
        Americas: ["Brazil", "Chile", "Mexico"],
        Europe: ["France", "Germany", "Spain"],
        Asia: ["India", "Japan"],
      };
      const data = [];
      Object.entries(regions).forEach(([region, countries], ri) => {
        countries.forEach((country, ci) => {
          for (let year = 2018; year <= 2024; year++) {
            data.push({
              region,
              country,
              year,
              revenue: 8 + ri * 4 + ci * 9 + (year - 2018) * (ci + ri + 1),
              margin: 0.12 + ri * 0.03 + ci * 0.02 + (year - 2018) * 0.01,
            });
          }
        });
      });
      const latest = data.filter(d => d.year === 2024);

      const figure = new d3plus.Figure()
        .select("#figure")
        .title("Revenue overview")
        .subtitle("Eight countries, 2018–2024")
        .saveControl(true)
        .layoutConfig({columns: [1, 1]})
        .responsive([{maxWidth: 700, config: {layoutConfig: {columns: 1}}}])
        .charts([
          {
            chart: new d3plus.Treemap()
              .data(latest)
              .groupBy(["region", "country"])
              .sum("revenue")
              .title("Share, 2024"),
            rowSpan: 2,
          },
          new d3plus.BarChart()
            .data(latest)
            .groupBy("country")
            .color("region")
            .x("country")
            .y("revenue")
            .legend(false)
            .title("By country, 2024"),
          new d3plus.LinePlot()
            .data(data)
            .groupBy("country")
            .color("region")
            .x("year")
            .y("revenue")
            .yConfig({tickFormat: d => `$${d}M`})
            .legend(false)
            .title("Over time"),
        ])
        .render();

      const configFigure = new d3plus.Figure()
        .select("#config")
        .title("Charts given as config")
        .layoutConfig({columns: [2, 1]})
        .charts([
          {
            chart: "StackedArea",
            config: {
              data,
              groupBy: "region",
              x: "year",
              y: "revenue",
              title: "Revenue by region",
            },
          },
          {
            chart: "Donut",
            config: {
              data: latest,
              groupBy: "region",
              value: "revenue",
              legend: false,
              title: "Share, 2024",
            },
          },
        ])
        .render();

      const nested = new d3plus.Figure()
        .select("#nested")
        .title("A figure in a figure")
        .chartConfig({theme: "dark"})
        .theme("dark")
        .layoutConfig({columns: [1, 2]})
        .charts([
          {
            chart: "Pie",
            config: {
              data: latest,
              groupBy: "region",
              value: "revenue",
              legend: false,
              title: "Share",
            },
          },
          new d3plus.Figure()
            .theme("dark")
            .chartConfig({theme: "dark"})
            .layoutConfig({columns: 1})
            .charts([
              {
                chart: "BarChart",
                config: {
                  data: latest,
                  groupBy: "country",
                  color: "region",
                  x: "country",
                  y: "revenue",
                  legend: false,
                },
              },
              {
                chart: "LinePlot",
                config: {
                  data,
                  groupBy: "country",
                  color: "region",
                  x: "year",
                  y: "margin",
                  yConfig: {tickFormat: d => `${Math.round(d * 100)}%`},
                  legend: false,
                },
              },
            ]),
        ])
        .render();

      let wide = false;
      document.querySelector("#highlight").addEventListener("click", () => {
        figure.charts()[0].chart.highlight(d => d.region === "Europe");
      });
      document.querySelector("#clear").addEventListener("click", () => {
        figure.charts()[0].chart.highlight(false);
      });
      document.querySelector("#columns").addEventListener("click", () => {
        wide = !wide;
        figure.layoutConfig({columns: wide ? [2, 1] : [1, 1]}).render();
      });
      document.querySelector("#save").addEventListener("click", () => {
        const blob = new Blob([figure.toSVGString()], {type: "image/svg+xml"});
        window.open(URL.createObjectURL(blob));
      });
    </script>
  </body>
</html>
