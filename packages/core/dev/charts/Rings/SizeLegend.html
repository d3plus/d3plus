<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>SizeLegend · Rings</title>
  <meta name="description" content="Rings sized by value with a size legend.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

</head>

<body></body>

<script>

  const values = {alpha: 50, beta: 100, gamma: 10, delta: 400, epsilon: 25, zeta: 800, eta: 60, theta: 150, iota: 5, kappa: 300};

  new d3plus.Rings()
    .data(Object.keys(values).map(id => ({id, value: values[id]})))
    .links([
      {source: "alpha", target: "beta"}, {source: "alpha", target: "gamma"}, {source: "alpha", target: "delta"},
      {source: "beta", target: "epsilon"}, {source: "beta", target: "zeta"}, {source: "gamma", target: "eta"},
      {source: "delta", target: "theta"}, {source: "delta", target: "iota"}, {source: "gamma", target: "kappa"}
    ])
    .center("alpha")
    .size("value")
    .label(d => `${d.id} (${d.value})`)
    .render();

</script>

</html>
