<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>Rings</title>
  <meta name="description" content="Rings centered on one product of the HS4 product space network.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

</head>

<body></body>

<script>

  const colors = {"10":"#EDE6D9","11":"#105B10","12":"#3ab11a","13":"#D66011","14":"#752277","15":"#5E1F05","16":"#17BCEF","17":"#9edae5","18":"#AA1F61","19":"#A4BD99","20":"#7F7F7F","21":"#93789E","22":"#C7C7C7","1":"#FFE999","2":"#FFC41C","3":"#E0902F","4":"#D1FF00","5":"#330000","6":"#E377C2","7":"#f7b6d2","8":"#98df8a","9":"#B00000"};

  // Click a node to re-center the rings on it.
  new d3plus.Rings()
    .nodes("../Network/network_hs4.json", resp => resp.nodes)
    .links("../Network/network_hs4.json", resp => resp.edges)
    .center("10101")
    .shapeConfig({
      fill: d => colors[d.id.slice(0, d.id.length === 6 ? 2 : 1)]
    })
    .render();

</script>

</html>
