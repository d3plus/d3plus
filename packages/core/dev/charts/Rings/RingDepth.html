<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ring Depth</title>
    <meta
      name="description"
      content="Rings with ringDepth 1, 2, or 3: how many rings of connections surround the center, switched with the buttons."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #controls {
        font-family: sans-serif;
        left: 50%;
        position: absolute;
        top: 8px;
        transform: translateX(-50%);
        z-index: 1;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      ringDepth:
      <button data-depth="1">1</button>
      <button data-depth="2">2</button>
      <button data-depth="3">3</button>
    </div>
  </body>

  <script>
    // Each ring holds the unclaimed neighbors of the ring inside it, placed
    // under their parent. Click a node to re-center the rings on it.
    var pairs = [
      ["Hub", "A"],
      ["Hub", "B"],
      ["Hub", "C"],
      ["Hub", "D"],
      ["Hub", "E"],
      ["A", "A1"],
      ["A", "A2"],
      ["A", "A3"],
      ["A", "B"],
      ["B", "B1"],
      ["B", "B2"],
      ["C", "C1"],
      ["D", "D1"],
      ["D", "D2"],
      ["A1", "A1a"],
      ["A1", "A1b"],
      ["A2", "A2a"],
      ["A3", "B1a"],
      ["B1", "B1a"],
      ["B1", "B1b"],
      ["B2", "B2a"],
      ["B2", "C1"],
      ["C1", "C1a"],
      ["C1", "C1b"],
      ["D1", "D1a"],
      ["D2", "D2a"],
      ["A1a", "X"],
      ["D2a", "Y"],
    ];
    var links = pairs.map(function (p) {
      return {source: p[0], target: p[1]};
    });

    var viz = new d3plus.Rings().links(links).center("Hub").ringDepth(3);
    viz.render();

    document.querySelectorAll("#controls button").forEach(function (button) {
      button.addEventListener("click", function () {
        viz.ringDepth(+button.dataset.depth).render();
      });
    });
  </script>
</html>
