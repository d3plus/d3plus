<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <script src="../../umd/d3plus-core.full.js"></script>

  <style>

    /* body {
      margin: 50px;
      overflow: hidden;
    } */

    #tile-switcher {
      font-size: 16px;
      position: absolute;
      right: 10px;
      top: 10px;
    }

  </style>

</head>

<body>

  <!-- element to contain our map -->
  <div id="viz"></div>

  <!-- selector to change tiles -->
  <select id="tile-switcher">
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}">Esri Light Gray Canvas (default)</option>
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}">Esri Dark Gray Canvas (default in dark mode)</option>
    <option value="https://tile.openstreetmap.org/{z}/{x}/{y}.png">OpenStreetMap Standard</option>
    <option value="https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png">OpenStreetMap Humanitarian</option>
    <option value="https://tile.opentopomap.org/{z}/{x}/{y}.png">OpenTopoMap</option>
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}">Esri Terrain</option>
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}">Esri Street Map</option>
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}">Esri Satellite Imagery</option>
    <option value="https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}">Esri National Geographic</option>
    <option value="https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}@2x.png">Stadia Alidade Smooth (key off localhost)</option>
    <option value="https://tiles.stadiamaps.com/tiles/stamen_toner_lite/{z}/{x}/{y}@2x.png">Stadia Stamen Toner Lite (key off localhost)</option>
    <option value="https://tiles.stadiamaps.com/tiles/stamen_terrain/{z}/{x}/{y}@2x.png">Stadia Stamen Terrain (key off localhost)</option>
    <option value="https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg">Stadia Stamen Watercolor (key off localhost)</option>
    <option value="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png">CARTO Positron (API key required)</option>
  </select>

</body>

<script>

var map = new d3plus.Geomap()
  .config({

    // draws the map inside of the "#viz" element
    // and sets a static height of 700
    select: "#viz",
    height: 700,

    // fits the max viewport to the boundaries of all
    // of the countries except Antarctica ("anata")
    fitObject: "https://oec.world/topojson/world-50m.json",
    fitFilter: function(d) { return d.id !== "anata"; },

    // removes outer padding around the default fit
    projectionPadding: 0

  })
  .render();

// attaches a Javascript listener to the "change"
// event of the "#tile-switcher" select element
document.querySelector("#tile-switcher")
  .addEventListener("change", function(event) {

    // reads the URL from the "value" attribute
    // of the selected option element
    const newUrl = event.target.value;

    // passed the new URL to the tileUrl method
    // and re-renders the map
    map.tileUrl(newUrl).render();

  });

</script>

</html>
