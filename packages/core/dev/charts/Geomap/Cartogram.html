<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cartogram</title>
    <meta
      name="description"
      content="Dorling and Demers cartograms of US states, world countries, and US counties by population, morphing to and from the map."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
      }

      #controls {
        display: flex;
        font-size: 14px;
        gap: 12px;
        padding: 6px 12px;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      <label>
        Map
        <select id="map">
          <option value="states">US states</option>
          <option value="world">World countries</option>
          <option value="counties">US counties</option>
        </select>
      </label>
      <label>
        Cartogram
        <select id="kind">
          <option value="dorling">Dorling</option>
          <option value="demers">Demers</option>
          <option value="false">Off</option>
        </select>
      </label>
      <label><input id="links" type="checkbox" checked /> Links</label>
      <button id="shuffle">Shuffle values</button>
    </div>
    <div id="viz"></div>
  </body>

  <script>
    var maps = {
      states: {
        flows: [
          {source: "04000US06", target: "04000US48", people: 102000},
          {source: "04000US06", target: "04000US04", people: 74000},
          {source: "04000US36", target: "04000US12", people: 64000},
          {source: "04000US36", target: "04000US34", people: 50000},
          {source: "04000US17", target: "04000US18", people: 30000},
          {source: "04000US12", target: "04000US13", people: 34000},
          {source: "04000US06", target: "04000US53", people: 33000},
        ],
        data: "./state-population.json",
        groupBy: "State ID",
        label: d => d.Abbr,
        projection: "geoAlbersUsa",
        topojson: "./State.json",
        topojsonId: f => f.id,
        topojsonKey: undefined,
      },
      world: {
        flows: [
          {source: 484, target: 840, people: 11000},
          {source: 356, target: 784, people: 3500},
          {source: 156, target: 840, people: 2900},
          {source: 608, target: 840, people: 2000},
          {source: 804, target: 616, people: 1600},
          {source: 50, target: 356, people: 3100},
        ],
        data: "./country-population.json",
        groupBy: "id",
        label: d => d.Country,
        projection: "geoEqualEarth",
        topojson: "./countries-110m.json",
        // The topojson ids are zero-padded strings ("076"); the data's are numbers.
        topojsonId: f => +f.id,
        topojsonKey: "countries",
      },
      counties: {
        flows: [],
        data: "./county-population.json",
        groupBy: "County ID",
        label: d => d.County,
        projection: "geoAlbersUsaTerritories",
        topojson: "./County.json",
        topojsonId: f => f.id,
        topojsonKey: undefined,
      },
    };

    var map = document.querySelector("#map");
    var kind = document.querySelector("#kind");
    var links = document.querySelector("#links");

    /** The chosen map's config, with its links when the box is checked. */
    function mapConfig() {
      var m = Object.assign({}, maps[map.value]);
      var flows = m.flows;
      delete m.flows;
      return Object.assign(m, {links: links.checked ? flows : []});
    }

    var chart = new d3plus.Geomap()
      .select("#viz")
      .config({
        arrows: true,
        cartogram: "dorling",
        colorScale: "Population",
        height: 560,
        linkSize: d => d.people,
        ...mapConfig(),
      })
      .render();

    map.addEventListener("change", function () {
      chart.config(mapConfig()).render();
    });

    links.addEventListener("change", function () {
      chart.config(mapConfig()).render();
    });

    kind.addEventListener("change", function () {
      chart.cartogram(kind.value === "false" ? false : kind.value).render();
    });

    document.querySelector("#shuffle").addEventListener("click", function () {
      var rows = chart.data();
      var values = rows.map(d => d.Population);
      for (var i = values.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = values[i];
        values[i] = values[j];
        values[j] = t;
      }
      chart
        .data(rows.map((d, i) => Object.assign({}, d, {Population: values[i]})))
        .render();
    });
  </script>
</html>
