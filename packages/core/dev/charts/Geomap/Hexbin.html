<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hexbin · Geomap</title>
    <meta
      name="description"
      content="Coordinate points binned into hexagons over the map: US cities by count, and 20,000 generated observations by summed value, over tiles."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
      }

      #controls {
        display: flex;
        font-size: 14px;
        gap: 12px;
        padding: 6px 12px;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      <label>
        Points
        <select id="points">
          <option value="cities">US cities, by count</option>
          <option value="observations">20,000 observations, by sum</option>
        </select>
      </label>
      <label>
        Radius
        <input id="radius" type="range" min="4" max="30" value="12" />
      </label>
      <label>
        <input id="hexbin" type="checkbox" checked />
        Hexbin
      </label>
    </div>
    <div id="viz"></div>
  </body>

  <script>
    /** A seeded random stream, so the observations are the same on every load. */
    function random(seed) {
      return function () {
        seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    var points = {
      cities: {
        data: "./city_coords.json",
        groupBy: "slug",
        label: d => `${d.city}, ${d.region}`,
        point: d => [d.longitude, d.latitude],
      },
    };

    var chart;
    var radius = document.querySelector("#radius");
    var hexbin = document.querySelector("#hexbin");

    function bins(kind) {
      if (!hexbin.checked) return false;
      return kind === "observations"
        ? {radius: +radius.value, value: "amount", label: "Total amount"}
        : {radius: +radius.value};
    }

    fetch("./city_coords.json")
      .then(r => r.json())
      .then(cities => {
        // Observations scattered around each city, each with an amount.
        var r = random(7);
        var rows = [];
        for (var i = 0; i < 20000; i++) {
          var c = cities[Math.floor(r() * cities.length)];
          var a = r() * 2 * Math.PI,
            d = Math.sqrt(-2 * Math.log(1 - r())) * 0.6;
          rows.push({
            id: i,
            amount: Math.round(10 + r() * 90),
            point: [
              c.longitude + d * Math.cos(a),
              c.latitude + d * Math.sin(a),
            ],
          });
        }
        points.observations = {
          data: rows,
          groupBy: "id",
          label: d => `Observation ${d.id}`,
          point: d => d.point,
        };
        chart = new d3plus.Geomap()
          .select("#viz")
          .config({
            height: 560,
            hexbin: bins("cities"),
            ...points.cities,
          })
          .render();
      });

    function update() {
      var kind = document.querySelector("#points").value;
      chart.config({hexbin: bins(kind), ...points[kind]}).render();
    }

    document.querySelector("#points").addEventListener("change", update);
    radius.addEventListener("change", update);
    hexbin.addEventListener("change", update);
  </script>
</html>
