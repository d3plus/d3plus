<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TopojsonRequest · Geomap</title>
    <meta name="description" content="Loads topojson through a request object (POST with headers and a body) and colors states by population.">
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body></body>

  <script>
    var popData = [
      {id: "04000US01", population: 4830620, growth: -48},
      {id: "04000US08", population: 5278906, growth: 52},
      {id: "04000US16", population: 1616547, growth: -16},
      {id: "04000US24", population: 5930538, growth: 59},
      {id: "04000US29", population: 6045448, growth: -60},
      {id: "04000US30", population: 1014699, growth: 10},
      {id: "04000US35", population: 2084117, growth: -20},
      {id: "04000US40", population: 3849733, growth: 38},
      {id: "04000US47", population: 6499615, growth: -64},
      {id: "04000US56", population: 579679, growth: 5},
    ];

    // topojson accepts a request object: everything besides `url` is passed
    // to fetch() as its init options.
    new d3plus.Geomap()
      .config({
        colorScale: "population",
        data: popData,
        projection: "geoAlbersUsa",
        topojson: {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          url: "./State.json",
          body: JSON.stringify([{country: "USA", level: 1}]),
        },
      })
      .render();
  </script>
</html>
