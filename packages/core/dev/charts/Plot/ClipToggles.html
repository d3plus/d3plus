<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clip Toggles · Plot</title>
    <meta
      name="description"
      content="Marks tween in place while a redraw adds or removes a clip: toggle baselineBreak, a yBreak and a yDomain that cuts the data off, and the bars and lines move rather than fade out and back in."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding: 16px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      button {
        font: inherit;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .viz {
        height: 300px;
      }
    </style>
  </head>

  <body>
    <div class="grid" id="grid"></div>

    <script>
      const housingStarts = [
        {year: 2019, starts: 1290},
        {year: 2020, starts: 1380},
        {year: 2021, starts: 1601},
        {year: 2022, starts: 1553},
        {year: 2023, starts: 1420},
        {year: 2024, starts: 1367},
      ];
      const sales = [
        {region: "North", sales: 42},
        {region: "South", sales: 58},
        {region: "East", sales: 35},
        {region: "Online", sales: 960},
        {region: "West", sales: 51},
      ];
      const values = [1000, 1012, 995, 940, 900, 990, 1024, 1040, 1018, 930];
      const series = ["Alpha", "Beta"].flatMap((id, s) =>
        values.map((v, x) => ({id, x, value: s ? v - 10 : v})),
      );

      // Each example: [title, chart type, base config, the two configs
      // its button flips between].
      const examples = [
        [
          "BarChart · baselineBreak",
          "BarChart",
          {
            data: housingStarts,
            groupBy: "year",
            x: "year",
            y: "starts",
            yDomain: [1200, 1700],
          },
          [{baselineBreak: true}, {baselineBreak: false}],
        ],
        [
          "BarChart · yBreak([80, 900])",
          "BarChart",
          {data: sales, groupBy: "region", x: "region", y: "sales"},
          [{yBreak: [80, 900]}, {yBreak: false}],
        ],
        [
          "LinePlot · yDomain([980]) cuts the lines off",
          "LinePlot",
          {data: series, groupBy: "id", x: "x", y: "value"},
          [{yDomain: [980]}, {yDomain: [850, 1050]}],
        ],
      ];

      const grid = document.getElementById("grid");
      examples.forEach(([title, type, base, states], i) => {
        const section = document.createElement("section");
        section.innerHTML = `<h3>${title}</h3><button></button><div class="viz" id="viz${i}"></div>`;
        grid.appendChild(section);
        let state = 0;
        const button = section.querySelector("button");
        const label = () =>
          (button.textContent = `Switch to ${JSON.stringify(states[1 - state])}`);
        const chart = new d3plus[type]()
          .select(`#viz${i}`)
          .config(base)
          .config(states[state])
          .legend(false);
        chart.render();
        label();
        button.addEventListener("click", () => {
          state = 1 - state;
          chart.duration(1500).config(states[state]).render();
          label();
        });
      });
    </script>
  </body>
</html>
