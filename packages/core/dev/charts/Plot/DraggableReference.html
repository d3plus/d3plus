<!doctype html>
<html dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Draggable Reference Lines · Plot</title>
    <meta
      name="description"
      content="Reference lines the reader drags (or moves with the arrow keys): a target that recolors the bars above and below it through a valueColors threshold, a line that highlights the points above it, a date line kept inside a range, a zoomable plot, and the drag and end events they fire."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .viz {
        height: 320px;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #log {
        font-size: 12px;
        min-height: 3em;
      }
    </style>
  </head>

  <body>
    <div class="grid">
      <div>
        <h3>
          BarChart: drag the target and the bars recolor (valueColors linked by
          id), snapping to whole units
        </h3>
        <div class="viz" id="bars"></div>
      </div>
      <div>
        <h3>Scatter: points above the line stay lit as it moves</h3>
        <div class="viz" id="scatter"></div>
      </div>
      <div>
        <h3>Time axis: a date line kept between two dates</h3>
        <div class="viz" id="time"></div>
      </div>
      <div>
        <h3>LinePlot with zoom (scroll to zoom, then drag the line)</h3>
        <div class="viz" id="zoom"></div>
      </div>
    </div>
    <h3>Events</h3>
    <pre id="log"></pre>

    <script>
      const log = document.querySelector("#log");
      const report = type => (value, line, index) => {
        const v =
          value instanceof Date ? value.toISOString().slice(0, 10) : value;
        log.textContent = `${type}.referenceLine #${index} (${line.id || "line"}): ${v}`;
      };

      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug"];
      const sales = months.map((month, i) => ({
        month,
        sales: 30 + ((i * 17) % 40),
      }));

      new d3plus.BarChart()
        .select("#bars")
        .data(sales)
        .groupBy("month")
        .x("month")
        .y("sales")
        .legend(false)
        .referenceLines([
          {
            y: 50,
            id: "target",
            draggable: {step: 1},
            label: value => `Target: ${value}`,
            dash: true,
          },
        ])
        .valueColors({values: "target", colors: ["#c92a2a", "#2b8a3e"]})
        .on("drag.referenceLine", report("drag"))
        .on("end.referenceLine", report("end"))
        .render();

      const points = [];
      for (let i = 0; i < 40; i++)
        points.push({
          id: `P${i}`,
          x: (i * 37) % 100,
          y: 10 + ((i * 53) % 80) + (i % 5) * 2,
        });

      new d3plus.Plot()
        .select("#scatter")
        .data(points)
        .groupBy("id")
        .legend(false)
        .referenceLines([
          {y: 50, id: "cutoff", draggable: true, highlight: "above"},
        ])
        .on("end.referenceLine", report("end"))
        .render();

      const monthly = [];
      for (let i = 0; i < 36; i++)
        monthly.push({
          id: "Price",
          date: new Date(2021, i, 1),
          value: 100 + 30 * Math.sin(i / 4) + i,
        });

      new d3plus.LinePlot()
        .select("#time")
        .data(monthly)
        .groupBy("id")
        .x("date")
        .time("date")
        .y("value")
        .timeline(false)
        .legend(false)
        .referenceLines([
          {
            x: new Date(2022, 5, 1),
            id: "launch",
            draggable: {min: new Date(2022, 0, 1), max: new Date(2022, 11, 31)},
          },
        ])
        .on("end.referenceLine", report("end"))
        .render();

      const series = [];
      ["Alpha", "Beta"].forEach((id, k) => {
        for (let i = 0; i <= 20; i++)
          series.push({id, x: i, y: 20 + k * 15 + ((i * (k + 3)) % 9) * 4});
      });

      new d3plus.LinePlot()
        .select("#zoom")
        .data(series)
        .groupBy("id")
        .zoom(true)
        .referenceLines([
          {y: 40, id: "goal", label: "Goal", draggable: true, dash: true},
        ])
        .on("drag.referenceLine", report("drag"))
        .render();
    </script>
  </body>
</html>
