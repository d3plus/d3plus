<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>Matrix</title>
  <meta name="description" content="Continent-to-continent trade Matrix with a jenks colorScale and axis titles.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>

</head>

<body>

<script>

  new d3plus.Matrix()
    .config({
      fontFamily: "Comic Sans MS",
      colorScale: "Trade Value",
      colorScaleConfig: {
        legendConfig: {
          title: "Trade Value"
        },
        scale: "jenks"
      },
      colorScalePosition: "right",
      column: "Importer Continent",
      columnConfig: {
        // ticks: [],
        title: "Importer Continent"
      },
      data: "./continent-trade.json",
      groupBy: ["Exporter Continent", "Importer Continent"],
      height: 500,
      row: "Exporter Continent",

      rowConfig: {
        title: "Exporter Continent"
      },
      title: "Continent to Continent Product Trade",
      titleConfig: {
        fontSize: 20
      },
      tooltipConfig: {
        tbody: [
          ["Trade Value", function(d) { return Math.round(d["Trade Value"]) }]
        ]
      },
      width: 400
    })
    .render();

</script>

</body>

</html>
