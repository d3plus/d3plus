<!doctype html>
<html>

  <head>

    <meta charset="utf-8">
    <title>DetectVisibleUnload · Viz</title>
    <meta name="description" content="detectVisible unloading of off-screen charts, with a live status panel.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0 16px 16px;
      }
      #hud {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        line-height: 1.5;
        padding: 10px 12px;
        position: fixed;
        right: 12px;
        top: 12px;
        width: 290px;
        z-index: 10;
      }
      #hud h1 {
        font-size: 14px;
        margin: 0 0 6px;
      }
      #hud label {
        display: block;
      }
      #hud input[type="number"] {
        width: 70px;
      }
      #hud .row {
        margin-top: 6px;
      }
      #hud button {
        margin: 2px 2px 0 0;
      }
      #counts span {
        border-radius: 3px;
        color: #fff;
        display: inline-block;
        margin-right: 4px;
        padding: 0 6px;
      }
      #log {
        color: #555;
        font-family: monospace;
        font-size: 11px;
        height: 110px;
        margin-top: 6px;
        overflow: hidden;
      }
      .card {
        border-bottom: 1px solid #ddd;
        height: 360px;
        margin: 0;
        position: relative;
        width: calc(100% - 320px);
      }
      .card .badge {
        border-radius: 3px;
        color: #fff;
        font-size: 12px;
        left: 6px;
        padding: 1px 6px;
        position: absolute;
        top: 6px;
        z-index: 5;
      }
      .loaded { background: #2e7d32; }
      .unloaded { background: #c62828; }
      .pending { background: #757575; }
    </style>

  </head>

  <body>

    <div id="hud">
      <h1>detectVisibleUnload</h1>
      <div id="counts"></div>
      <div>DOM nodes: <b id="dom"></b></div>
      <form method="get" class="row">
        <label><input type="checkbox" name="unload" value="1"> detectVisibleUnload</label>
        <label>detectVisibleInterval <input type="number" name="delay" min="0" step="100"> ms</label>
        <label>charts <input type="number" name="charts" min="1" max="500"></label>
        <button type="submit">Apply (reloads page)</button>
      </form>
      <div class="row">
        <button id="top">Top</button>
        <button id="middle">Middle</button>
        <button id="bottom">Bottom</button>
        <button id="fast">Fast scroll</button>
        <button id="rerender">Re-render all</button>
      </div>
      <div id="log"></div>
    </div>

    <script>

      // Manual test for viewport-aware charts (detectVisible + detectVisibleUnload).
      //
      // What to check:
      //   1. Charts start "pending" (grey). Scroll slowly: the chart(s) you stop
      //      at turn "loaded" (green) after `detectVisibleInterval`.
      //   2. "Fast scroll" flies past the whole list: nothing between the top
      //      and bottom should render, only the charts where it stops.
      //   3. With detectVisibleUnload on, charts that leave the screen turn
      //      "unloaded" (red) and their DOM node count drops; scrolling back
      //      redraws them immediately without an animation. DOM nodes in the
      //      HUD should stay roughly constant however far you scroll.
      //   4. Untick it (Apply) and re-scroll: charts stay loaded. Either way each
      //      <svg> has `content-visibility: auto` (inspect one) so the browser
      //      skips its contents while far off-screen. Hover a chart near its
      //      edge: the tooltip is not clipped.
      //   5. Zoom/hover state is not kept across an unload; that is expected.

      const params = new URLSearchParams(location.search);
      const unload = params.has("charts") ? params.get("unload") === "1" : true;
      const delay = params.has("delay") ? +params.get("delay") : 1000;
      const count = params.has("charts") ? +params.get("charts") : 60;

      document.querySelector("[name=unload]").checked = unload;
      document.querySelector("[name=delay]").value = delay;
      document.querySelector("[name=charts]").value = count;

      let seed = 12345;
      function rnd() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      const makers = [
        ["BarChart", () => {
          const data = [];
          for (const g of ["A", "B", "C", "D"])
            for (let i = 0; i < 12; i++) data.push({g, x: "c" + i, y: Math.round(rnd() * 100)});
          return new d3plus.BarChart().groupBy("g").data(data).x("x").y("y");
        }],
        ["Treemap", () => {
          const data = [];
          for (let g = 0; g < 10; g++)
            for (let i = 0; i < 15; i++) data.push({group: "G" + g, id: `G${g}-${i}`, value: 1 + Math.round(rnd() * 100)});
          return new d3plus.Treemap().groupBy(["group", "id"]).data(data).sum("value");
        }],
        ["LinePlot", () => {
          const data = [];
          for (const g of ["S1", "S2", "S3", "S4", "S5", "S6"])
            for (let i = 0; i < 40; i++) data.push({g, x: i, y: Math.round(rnd() * 100)});
          return new d3plus.LinePlot().groupBy("g").data(data).x("x").y("y");
        }]
      ];

      const cards = [];
      for (let i = 0; i < count; i++) {
        const [name, make] = makers[i % makers.length];
        const card = document.createElement("div");
        card.className = "card";
        const badge = document.createElement("div");
        badge.className = "badge pending";
        card.appendChild(badge);
        document.body.appendChild(card);
        const viz = make()
          .detectVisible(true)
          .detectVisibleInterval(delay)
          .detectVisibleUnload(unload)
          .select(card)
          .render();
        cards.push({badge, card, name, state: "pending", viz});
      }

      // Status is read from the DOM + instance flag; the poll is only for display.
      const LOADED_MIN_NODES = 60;
      const logEl = document.getElementById("log");
      const lines = [];
      const t0 = performance.now();
      function log(msg) {
        lines.unshift(`${((performance.now() - t0) / 1000).toFixed(1)}s ${msg}`);
        lines.length = Math.min(lines.length, 8);
        logEl.textContent = lines.join("\n");
      }

      function refresh() {
        const tally = {loaded: 0, unloaded: 0, pending: 0};
        cards.forEach((c, i) => {
          const nodes = c.card.querySelectorAll("*").length;
          const state = c.viz._unloaded ? "unloaded" : nodes > LOADED_MIN_NODES ? "loaded" : "pending";
          if (state !== c.state) {
            if (state !== "pending" || c.state === "loaded") log(`#${i + 1} ${c.name}: ${c.state} -> ${state}`);
            c.state = state;
          }
          tally[state]++;
          c.badge.className = "badge " + state;
          c.badge.textContent = `#${i + 1} ${c.name} · ${state} · ${nodes} nodes`;
        });
        document.getElementById("counts").innerHTML =
          `<span class="loaded">${tally.loaded} loaded</span>` +
          `<span class="unloaded">${tally.unloaded} unloaded</span>` +
          `<span class="pending">${tally.pending} pending</span>`;
        document.getElementById("dom").textContent = document.getElementsByTagName("*").length;
      }
      setInterval(refresh, 100);
      refresh();

      const max = () => document.documentElement.scrollHeight - innerHeight;
      document.getElementById("top").onclick = () => scrollTo(0, 0);
      document.getElementById("middle").onclick = () => scrollTo(0, max() / 2);
      document.getElementById("bottom").onclick = () => scrollTo(0, max());
      document.getElementById("rerender").onclick = () => cards.forEach(c => c.viz.render());

      document.getElementById("fast").onclick = async () => {
        const raf = () => new Promise(r => requestAnimationFrame(r));
        const before = cards.filter(c => c.state === "loaded").length;
        log("fast scroll to bottom...");
        scrollTo(0, 0);
        await raf();
        for (let y = 0; y <= max(); y += 300) {
          scrollTo(0, y);
          await raf(); await raf(); await raf();
        }
        log(`fast scroll done (${before} loaded before)`);
      };

    </script>

  </body>

</html>
