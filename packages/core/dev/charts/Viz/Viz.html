<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Viz</title>
    <meta name="description" content="Base Viz chrome: title, total, legend and timeline.">
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>

    <style>
      body {
        margin: 0;
      }

      .viz {
        border: 1px solid #ddd;
        height: 400px;
        margin: 50px;
      }
    </style>
  </head>

  <body>
    <main dir="ltr">
      <div class="viz" id="viz1"></div>
      <div class="viz" id="viz2"></div>
    </main>

    <script>
      // The base Viz draws no shapes of its own, only the shared chrome: a
      // wrapping title, a total, a bottom legend and a timeline.
      new d3plus.Viz()
        .data("./data2.json")
        .time("year")
        .title("Here is a long title that should wrap and change the top margin.")
        .total(d => d.value)
        .legendPosition("bottom")
        .select("#viz1")
        .render();

      new d3plus.Viz()
        .data("./data2.json")
        .select("#viz2")
        .render();
    </script>
  </body>
</html>
