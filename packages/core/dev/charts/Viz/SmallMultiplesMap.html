<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Small Multiples Map</title>
    <meta
      name="description"
      content="Map-shaped small multiples (facetConfig.layout): a LinePlot per US state on the us-states grid, BarCharts on the eu-countries and world-regions grids, and a custom {value: [row, column]} grid."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .stack {
        display: grid;
        gap: 24px;
        padding: 16px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #states {
        height: 620px;
      }
      #eu {
        height: 560px;
      }
      #regions,
      #custom {
        height: 380px;
      }
    </style>
  </head>

  <body>
    <div class="stack">
      <div>
        <h3>us-states: a LinePlot per state, by postal code</h3>
        <div id="states"></div>
      </div>
      <div>
        <h3>eu-countries: matched by country name</h3>
        <div id="eu"></div>
      </div>
      <div>
        <h3>world-regions: matched by World Bank region name</h3>
        <div id="regions"></div>
      </div>
      <div>
        <h3>A custom grid: {value: [row, column]}</h3>
        <div id="custom"></div>
      </div>
    </div>
  </body>

  <script>
    // Synthetic values, varied by a hash of each place's name.
    const hash = text =>
      Array.from(text).reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 7);
    const states =
      "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(
        " ",
      );
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023];
    const rates = states.flatMap(state =>
      years.map((year, k) => {
        const h = hash(state);
        const covid = year === 2020 ? 3 + (h % 5) : year === 2021 ? 1.5 : 0;
        return {
          state,
          year,
          rate: Math.round((3 + (h % 40) / 10 - k * 0.15 + covid) * 10) / 10,
        };
      }),
    );
    new d3plus.LinePlot()
      .select("#states")
      .data(rates)
      .config({
        facet: "state",
        facetConfig: {layout: "us-states", padding: 6},
        groupBy: "state",
        legend: false,
        lineLabels: false,
        title: "Unemployment rate (%), 2016–2023",
        x: "year",
        xConfig: {ticks: [2016, 2023]},
        y: "rate",
      })
      .render();

    const eu =
      "Austria Belgium Bulgaria Croatia Cyprus Czechia Denmark Estonia Finland France Germany Greece Hungary Ireland Italy Latvia Lithuania Luxembourg Malta Netherlands Poland Portugal Romania Slovakia Slovenia Spain Sweden".split(
        " ",
      );
    const sources = ["Wind", "Solar", "Hydro"];
    new d3plus.BarChart()
      .select("#eu")
      .data(
        eu.flatMap(country =>
          sources.map((source, k) => ({
            country,
            source,
            share: (hash(country + source) % 30) + k * 2,
          })),
        ),
      )
      .config({
        facet: "country",
        facetConfig: {layout: "eu-countries", padding: 6},
        groupBy: "source",
        shapeConfig: {label: false},
        title: "Renewable electricity share (%)",
        x: "source",
        xConfig: {labels: []},
        y: "share",
        yConfig: {title: false},
      })
      .render();

    const regions = [
      "East Asia & Pacific",
      "Europe & Central Asia",
      "Latin America & Caribbean",
      "Middle East & North Africa",
      "North America",
      "South Asia",
      "Sub-Saharan Africa",
    ];
    new d3plus.Donut()
      .select("#regions")
      .data(
        regions.flatMap(region =>
          ["Urban", "Rural"].map((type, k) => ({
            region,
            type,
            population: 20 + (hash(region) % 60) * (k ? 1 : 1.4),
          })),
        ),
      )
      .config({
        facet: "region",
        facetConfig: {layout: "world-regions"},
        groupBy: "type",
        value: "population",
      })
      .render();

    new d3plus.BarChart()
      .select("#custom")
      .data(
        ["North", "West", "Central", "East", "South"].flatMap(zone =>
          [1, 2, 3, 4].map(quarter => ({
            zone,
            quarter: `Q${quarter}`,
            sales: (hash(zone + quarter) % 40) + 10,
          })),
        ),
      )
      .config({
        facet: "zone",
        facetConfig: {
          layout: {
            North: [0, 1],
            West: [1, 0],
            Central: [1, 1],
            East: [1, 2],
            South: [2, 1],
          },
        },
        groupBy: "quarter",
        x: "quarter",
        y: "sales",
      })
      .render();
  </script>
</html>
