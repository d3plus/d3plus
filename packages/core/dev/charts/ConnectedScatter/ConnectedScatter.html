<!doctype html>
<html dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>ConnectedScatter</title>
    <meta
      name="description"
      content="ConnectedScatter variants: three countries' paths by year, one looping path, Scatter with order and no arrows, a Line with markers doubling back, data order with custom labels, crowded paths whose end labels hide when they collide, and small multiples."
    />
    <script src="/umd/d3plus-core.full.js"></script>
    <script src="/dev.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Inter, sans-serif;
        margin: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .viz {
        height: 420px;
      }
      .wide {
        grid-column: 1 / span 2;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
    </style>
  </head>

  <body>
    <div class="grid">
      <div>
        <h3>order: "year", three countries</h3>
        <div class="viz" id="countries"></div>
      </div>
      <div>
        <h3>One looping path</h3>
        <div class="viz" id="loop"></div>
      </div>
      <div>
        <h3>Scatter with order, pathArrows: false</h3>
        <div class="viz" id="scatter"></div>
      </div>
      <div>
        <h3>Plot with shape "Line", lineMarkers, and order</h3>
        <div class="viz" id="line"></div>
      </div>
      <div>
        <h3>Data order, pathLabels as a function</h3>
        <div class="viz" id="data-order"></div>
      </div>
      <div class="wide">
        <h3>Crowded paths: end labels that would collide hide</h3>
        <div class="viz" id="crowded"></div>
      </div>
      <div>
        <h3>Small multiples (facet: "country")</h3>
        <div class="viz" id="facet"></div>
      </div>
    </div>
  </body>

  <script>
    // Seeded rows so the page renders identically every load.
    let seed = 5;
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const round = (v, d = 1) => Math.round(v * 10 ** d) / 10 ** d;

    const countries = [
      {country: "Avalon", gdp: 8000, growth: 0.035, life: 66, gain: 0.32},
      {country: "Brightwater", gdp: 22000, growth: 0.018, life: 74, gain: 0.18},
      {country: "Cedar Isles", gdp: 3000, growth: 0.05, life: 55, gain: 0.45},
    ];
    const years = Array.from({length: 16}, (_, i) => 1990 + i * 2);
    const development = countries.flatMap(
      ({country, gdp, growth, life, gain}) =>
        years.map((year, i) => {
          // A downturn in the middle years pulls the path back.
          const shock = i >= 7 && i <= 9 ? 0.82 : 1;
          return {
            country,
            year,
            "GDP per Capita": Math.round(
              gdp * (1 + growth) ** (i * 2) * shock * (0.97 + random() * 0.06),
            ),
            "Life Expectancy": round(
              life + gain * i * 2 - (shock < 1 ? 2.5 : 0) + random() * 0.6,
            ),
          };
        }),
    );

    // Gas price against miles driven: a path that loops back on itself.
    const driving = Array.from({length: 30}, (_, i) => {
      const t = i / 29;
      return {
        id: "United States",
        year: 1980 + i,
        "Miles Driven per Person": Math.round(
          7000 + 3000 * t + 600 * Math.sin(t * Math.PI * 3),
        ),
        "Gas Price": round(
          2.2 + 1.2 * Math.cos(t * Math.PI * 2.4) + 0.6 * t,
          2,
        ),
      };
    });

    new d3plus.ConnectedScatter()
      .select("#countries")
      .data(development)
      .groupBy("country")
      .x("GDP per Capita")
      .y("Life Expectancy")
      .order("year")
      .render();

    new d3plus.ConnectedScatter()
      .select("#loop")
      .data(driving)
      .groupBy("id")
      .x("Miles Driven per Person")
      .y("Gas Price")
      .order("year")
      .render();

    new d3plus.Scatter()
      .select("#scatter")
      .data(development)
      .groupBy("country")
      .x("GDP per Capita")
      .y("Life Expectancy")
      .order("year")
      .pathArrows(false)
      .render();

    new d3plus.Plot()
      .select("#line")
      .data(driving)
      .groupBy("id")
      .x("Miles Driven per Person")
      .y("Gas Price")
      .shape("Line")
      .lineMarkers(true)
      .order("year")
      .render();

    new d3plus.ConnectedScatter()
      .select("#data-order")
      .data(driving)
      .groupBy("id")
      .x("Miles Driven per Person")
      .y("Gas Price")
      .pathLabels(d => `${d.year}`)
      .render();

    // Ten series that start apart and end close together.
    const crowded = Array.from({length: 10}, (_, s) =>
      Array.from({length: 8}, (_, i) => ({
        series: `Series ${s + 1}`,
        year: 2010 + i,
        x: round(10 + s * 8 * (1 - i / 8) + i * 4 + random() * 2),
        y: round(20 + s * 6 * (1 - i / 9) + i * 3 + random() * 2),
      })),
    ).flat();

    new d3plus.ConnectedScatter()
      .select("#crowded")
      .data(crowded)
      .groupBy("series")
      .order("year")
      .render();

    new d3plus.ConnectedScatter()
      .select("#facet")
      .data(development)
      .groupBy("country")
      .x("GDP per Capita")
      .y("Life Expectancy")
      .order("year")
      .facet("country")
      .legend(false)
      .render();
  </script>
</html>
