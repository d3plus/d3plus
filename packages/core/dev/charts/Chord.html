<!doctype html>
<html>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

<body></body>

<script>

  new d3plus.Chord()
    .value("value")
    .links([
      {source: "alpha", target: "beta",  value: 5},
      {source: "alpha", target: "gamma", value: 3},
      {source: "beta",  target: "gamma", value: 2},
      {source: "gamma", target: "alpha", value: 4},
      {source: "delta", target: "alpha", value: 6}
    ])
    .render();

  // Undirected — merges both directions of a pair into a single ribbon
  // (classic d3.chord layout). A node's arc size is its outgoing total only,
  // so every node needs at least one outgoing link or its arc vanishes.

  // new d3plus.Chord()

  //     {source: "B", target: "C", value: 2},
  //     {source: "C", target: "A", value: 3}
  //   ])
  //   .render();

  // Arrows — ribbonArrow head on the target end of every ribbon.

  // new d3plus.Chord()
  //   .arrows(true)

  //     {source: "alpha", target: "beta",  value: 8},

  //     {source: "gamma", target: "alpha", value: 6},
  //     {source: "alpha", target: "gamma", value: 3}
  //   ])
  //   .render();

  // Self-loop — a link whose source and target are the same node writes to
  // the diagonal of the flow matrix (reflexive/within-group flow).

  // new d3plus.Chord()

  //     {source: "A", target: "B", value: 3}
  //   ])
  //   .render();

  // Nodes inferred from link endpoints, no explicit .nodes() call, using an
