<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>ProductSpace · Network</title>
  <meta name="description" content="Product space: the HS4 network colored by section, using trade data.">
  <script src="/umd/d3plus-core.full.js"></script>
  <script src="/dev.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

    #viz {
      height: 600px;
    }

  </style>

</head>

<body></body>

<script>

  const colors = {"10":"#EDE6D9","11":"#105B10","12":"#3ab11a","13":"#D66011","14":"#752277","15":"#5E1F05","16":"#17BCEF","17":"#9edae5","18":"#AA1F61","19":"#A4BD99","20":"#7F7F7F","21":"#93789E","22":"#C7C7C7","1":"#FFE999","2":"#FFC41C","3":"#E0902F","4":"#D1FF00","5":"#330000","6":"#E377C2","7":"#f7b6d2","8":"#98df8a","9":"#B00000"};

  const unique = (arr, cb) => {
    const l = Array.from(new Set(arr.map(cb)));
    return l.length === 1 ? l[0] : l;
  };

  // Products the country exports with a revealed comparative advantage
  // (RCA > 1) take their section color; the rest stay gray.
  new d3plus.Network()
    .aggs({
      "HS2 ID": unique,
      "HS4 ID": unique
    })
    .data("./oec2018.json")
    .nodes("./network_hs4.json", resp => resp.nodes)
    .links("./network_hs4.json", resp => resp.edges)
    .groupBy(["HS2 ID", "id"])
    .legend(false)
    .label(d => d.HS4)
    .shapeConfig({
      fill: d => d["Trade Value RCA"] > 1 ? colors[d["Section ID"]] : "#ccc"
    })
    .render();

</script>

</html>
