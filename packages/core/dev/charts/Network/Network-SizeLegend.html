<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <script src="../../umd/d3plus-core.full.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
    }

  </style>

</head>

<body></body>

<script>

  const nodes = [
    {id: "Hub", value: 900}, {id: "Alpha", value: 420}, {id: "Beta", value: 260}, {id: "Gamma", value: 120},
    {id: "Delta", value: 610}, {id: "Epsilon", value: 60}, {id: "Zeta", value: 180}, {id: "Eta", value: 30},
    {id: "Theta", value: 340}, {id: "Iota", value: 90}, {id: "Kappa", value: 15}, {id: "Lambda", value: 220}
  ];

  const links = [
    ["Hub", "Alpha"], ["Hub", "Beta"], ["Hub", "Gamma"], ["Hub", "Delta"], ["Alpha", "Epsilon"],
    ["Alpha", "Zeta"], ["Beta", "Eta"], ["Delta", "Theta"], ["Delta", "Iota"], ["Gamma", "Kappa"],
    ["Theta", "Lambda"], ["Zeta", "Lambda"]
  ].map(([source, target]) => ({source, target}));

  // Force-directed (no x/y), sized by value; zoom in to watch the legend relabel.
  new d3plus.Network()
    .nodes(nodes)
    .links(links)
    .size("value")
    .sizeMin(4)
    .render();

</script>

</html>
