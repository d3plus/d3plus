<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TextWrap</title>
    <meta name="description" content="textSplit() and textWrap() on a string with inline HTML.">
    <script src="/umd/d3plus-text.full.js"></script>

    <style>
      @font-face {
        font-family: "Pathway Gothic One";
        font-style: normal;
        font-weight: 400;
        src: url(./PathwayGothicOne-Ext.woff2) format("woff2");
        unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Pathway Gothic One";
        font-style: normal;
        font-weight: 400;
        src: url(./PathwayGothicOne-Latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      body {
        margin: 0;
      }

      p {
        display: block;
        font-family: "Pathway Gothic One";
      }

      .box {
        border: 1px solid red;
        display: inline-block;
        height: 200px;
        margin-right: 42px;
        width: 150px;
      }

      svg {
        position: absolute;
        top: 0;
      }
    </style>
  </head>

  <body></body>

  <script>

    // Prints each logged value into the page as well as the console.
    const output = document.body.appendChild(document.createElement("pre"));
    const log = (...args) => {
      console.log(...args);
      const text = args.map(a => {
        if (typeof a === "string") return a;
        try {
          return JSON.stringify(a, (k, v) => (typeof v === "function" ? `${v}` : v));
        } catch {
          return String(a);
        }
      });
      output.textContent += `${text.join(" ")}\n`;
    };
    const string = "Here is a <b>long string</b> with some text to wrap.";
    // const string = "veryLongTextWithoutAnyLimitCharacterThatShouldBeTruncatedWhenUsingOverflow";
    // const string = "“里句。”";
    log(d3plus.textSplit(string));

    var wrapper = d3plus.textWrap().width(100).overflow(true);
    var result = wrapper(string);
    log(result.lines);

    // var result2 = wrapper(string + " " + string);
    // log(result2);

    // log(d3plus.strip("hére's myō tūxt والاجتماعية"));

    // log(d3plus.fontExists("Pathway Gothic One"));

    //   draw();
    // }, 100);

    // log("rtl", d3plus.rtl("#no-exists"));
  </script>
</html>
