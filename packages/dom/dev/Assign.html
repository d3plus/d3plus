<!doctype html>
<html>

<head>

  <meta charset="utf-8">
  <title>Assign</title>
  <meta name="description" content="assign() deep-merging config objects, window and document.">
  <script src="/umd/d3plus-dom.full.js"></script>

  <style>

    body {
      margin: 0;
    }

  </style>

</head>

<body>

</body>

<script>

  // Prints each logged value into the page as well as the console.
  const output = document.body.appendChild(document.createElement("pre"));
  const log = (...args) => {
    console.log(...args);
    const text = args.map(a => {
      if (typeof a === "string") return a;
      try {
        return JSON.stringify(a, (k, v) => (typeof v === "function" ? `${v}` : v));
      } catch {
        return String(a);
      }
    });
    output.textContent += `${text.join(" ")}\n`;
  };


  var clone = d3plus.assign(
    {},
    {colorScaleConfig: {color: ["red", "blue"]}},
    {colorScaleConfig: {tickFormat: d => d * 100}, thing: window, other: document}
  );
  log(clone);

  var w = d3plus.assign({}, window);
  log(w);

  var d = d3plus.assign({}, document);
  log(d);

</script>

</html>
