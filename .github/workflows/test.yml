name: Lint Code and Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a pull request supersedes its in-flight run, so cancel that
# run rather than letting both occupy runners. Pushes to main each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:

    runs-on: ubuntu-latest
    # Node 26 is still "Current" (LTS begins 2026-10-28), so run it as a
    # forward-compat canary that reports but doesn't block merges when a
    # bleeding-edge dependency lags. The supported LTS lines (22, 24) block.
    continue-on-error: ${{ matrix.node-version == '26.x' }}
    env:
      FORCE_COLOR: "1"

    strategy:
      # Report every version's result instead of cancelling the rest when one
      # leg fails.
      fail-fast: false
      matrix:
        # 22 (Jod) and 24 (Krypton) are Active LTS; 20 (Iron) went EOL
        # 2026-04-30. 26 is the current release (canary, see continue-on-error).
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @d3plus/core exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Both Playwright install steps hit the network / apt and flake
      # intermittently on the runners (install-deps has exited 100 mid-release),
      # so retry each a few times before failing the job.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until pnpm --filter @d3plus/core exec playwright install chromium; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "playwright install chromium failed after $n attempts"; exit 1; fi
            echo "playwright install chromium failed (attempt $n); retrying in 15s..."; sleep 15
          done
      - name: Install Playwright system dependencies
        run: |
          n=0
          until pnpm --filter @d3plus/core exec playwright install-deps chromium; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "playwright install-deps chromium failed after $n attempts"; exit 1; fi
            echo "playwright install-deps chromium failed (attempt $n); retrying in 15s..."; sleep 15
          done
      - name: Run tests
        if: matrix.node-version != '22.x'
        run: pnpm test
      # The coverage run executes the same suites, so 22.x lints separately and
      # runs them once, under c8, instead of a plain pass followed by a
      # coverage pass.
      - name: Lint
        if: matrix.node-version == '22.x'
        run: pnpm lint
      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        run: pnpm test:coverage
      - name: Typecheck (build types)
        run: pnpm -r --if-present run build:types
      - name: Build docs site (Storybook)
        if: matrix.node-version == '22.x'
        run: pnpm --filter @d3plus/docs build
      # One upload per package, flagged with its directory name to match the
      # flags in codecov.yml. lcov paths are relative to each package, so they
      # are prefixed with its directory first. The commit, PR and branch are
      # passed explicitly (as codecov-action does) because the shallow checkout
      # leaves the CLI only the PR's merge commit; a fork's branch is sent as
      # "owner:branch" for a tokenless upload. Upload failures warn without
      # failing the job.
      - name: Upload coverage
        if: matrix.node-version == '22.x'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.label || github.head_ref || github.ref_name }}
        run: |
          pipx install codecov-cli==11.3.1
          for lcov in packages/*/coverage/lcov.info; do
            pkg_dir=$(dirname "$(dirname "$lcov")")
            flag=$(basename "$pkg_dir")
            sed -i "s|^SF:|SF:${pkg_dir}/|" "$lcov"
            codecovcli upload-coverage \
              ${CODECOV_TOKEN:+--token "$CODECOV_TOKEN"} \
              --git-service github --slug "$GITHUB_REPOSITORY" \
              --sha "$SHA" --branch "$BRANCH" ${PR:+--pr "$PR"} \
              --plugin noop --disable-search --fail-on-error \
              --file "$lcov" --flag "$flag" --name "$flag" \
              || echo "::warning::Codecov upload failed for $flag"
          done
