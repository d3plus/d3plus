name: Lint Code and Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes its in-flight run, so cancel that
# run rather than letting both occupy runners. Pushes to main each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Version-independent checks run once rather than on every matrix leg.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck (build types)
        run: pnpm -r --if-present run build:types
      - name: Build docs site (Storybook)
        run: pnpm --filter @d3plus/docs build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Node 26 is still "Current" (LTS begins 2026-10-28), so run it as a
    # forward-compat canary that reports but doesn't block merges when a
    # bleeding-edge dependency lags. The supported LTS lines (22, 24) block.
    continue-on-error: ${{ matrix.node-version == '26.x' }}
    env:
      FORCE_COLOR: "1"

    strategy:
      # Report every version's result instead of cancelling the rest when one
      # leg fails.
      fail-fast: false
      matrix:
        # 22 (Jod) and 24 (Krypton) are Active LTS; 20 (Iron) went EOL
        # 2026-04-30. 26 is the current release (canary, see continue-on-error).
        node-version: [22.x, 24.x, 26.x]

    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch, so two commits are enough to list what it changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      # A pull request tests only the packages it changes and their
      # dependents (everything, if it changes shared config, test helpers,
      # scripts or the lockfile); a push to main tests everything. Codecov
      # carries the skipped packages' coverage forward.
      - name: Pick the packages to test
        id: affected
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/affected.js HEAD^1 | tee -a "$GITHUB_OUTPUT"
          else
            printf 'packages=all\nbrowser=true\n' | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Get Playwright version
        if: steps.affected.outputs.browser == 'true'
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.affected.outputs.browser == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Both Playwright install steps hit the network / apt and flake
      # intermittently on the runners (install-deps has exited 100 mid-release),
      # so retry each a few times before failing the job.
      - name: Install Playwright Chromium
        if: steps.affected.outputs.browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          n=0
          until pnpm exec playwright install chromium; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "playwright install chromium failed after $n attempts"; exit 1; fi
            echo "playwright install chromium failed (attempt $n); retrying in 15s..."; sleep 15
          done
      - name: Install Playwright system dependencies
        if: steps.affected.outputs.browser == 'true'
        run: |
          n=0
          until pnpm exec playwright install-deps chromium; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "playwright install-deps chromium failed after $n attempts"; exit 1; fi
            echo "playwright install-deps chromium failed (attempt $n); retrying in 15s..."; sleep 15
          done
      # Linting runs in the check job. 22.x runs the suites once, with
      # coverage, instead of a plain pass followed by a coverage pass. Tests
      # import each package's source, so nothing is built first.
      - name: Run tests
        if: matrix.node-version != '22.x' && steps.affected.outputs.packages != 'none'
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          if [ "$PACKAGES" = all ]; then
            pnpm vitest run
          else
            pnpm $(printf -- '--filter=%s ' $PACKAGES) --if-present run test
          fi
      - name: Run tests with coverage
        if: matrix.node-version == '22.x' && steps.affected.outputs.packages != 'none'
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          if [ "$PACKAGES" = all ]; then
            pnpm test:coverage
          else
            pnpm $(printf -- '--filter=%s ' $PACKAGES) --if-present run test:coverage
          fi
      # One upload per package, flagged with its directory name to match the
      # flags in codecov.yml; lcov paths are relative to the repo root. The
      # commit, PR and branch are passed explicitly (as codecov-action does)
      # because the shallow checkout leaves the CLI only the PR's merge
      # commit; a fork's branch is sent as "owner:branch" for a tokenless
      # upload. Upload failures warn without failing the job.
      - name: Upload coverage
        if: matrix.node-version == '22.x' && steps.affected.outputs.packages != 'none'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.label || github.head_ref || github.ref_name }}
        run: |
          pipx install codecov-cli==11.3.1
          for lcov in packages/*/coverage/lcov.info; do
            flag=$(basename "$(dirname "$(dirname "$lcov")")")
            codecovcli upload-coverage \
              ${CODECOV_TOKEN:+--token "$CODECOV_TOKEN"} \
              --git-service github --slug "$GITHUB_REPOSITORY" \
              --sha "$SHA" --branch "$BRANCH" ${PR:+--pr "$PR"} \
              --plugin noop --disable-search --fail-on-error \
              --file "$lcov" --flag "$flag" --name "$flag" \
              || echo "::warning::Codecov upload failed for $flag"
          done
