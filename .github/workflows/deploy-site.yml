name: Deploy the docs site to GitHub Pages

# The site documents the latest release: its API reference is generated from
# the released source when it deploys. Run it by hand to redeploy.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A prerelease ships under npm's "next" tag; the site stays on "latest".
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
      - run: pnpm install
      # The API reference reads each package's built type declarations.
      - run: pnpm -r --if-present run build:types
      - run: pnpm --filter @d3plus/site run manifest
      - run: pnpm --filter @d3plus/site build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
