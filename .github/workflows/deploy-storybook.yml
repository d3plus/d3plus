name: Deploy Storybook to Github Pages

# The site documents the latest release: the generated args and API docs are
# only regenerated by `pnpm run release`. Run it by hand to redeploy.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A prerelease ships under npm's "next" tag; the site stays on "latest".
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @d3plus/docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/build
      - uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
