name: Deploy Storybook to Github Pages

on:
  push:
    branches:
      - "main"
    # The site aliases every package to its source, so a source change
    # changes the docs too.
    paths:
      - ".github/workflows/deploy-storybook.yml"
      - "packages/*/index.ts"
      - "packages/*/index.tsx"
      - "packages/*/src/**"
      - "packages/docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @d3plus/docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/build
      - uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
