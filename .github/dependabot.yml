version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # pnpm workspaces: one PR per group for the whole repo, including the
  # catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # typescript-eslint and TypeDoc support TypeScript up to 6.0; 7 (the
    # native port) has no JS API for them to build on.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      d3:
        patterns: ["d3-*", "@types/d3-*"]
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
